<div class="notification-container" aria-live="polite" aria-atomic="true">
  <div
    *ngFor="let n of (notificationService.notifications$ | async); trackBy: trackById"
    class="alert alert-dismissible fade show notification-item"
    [ngClass]="cssClass(n.type)"
    role="alert">
    <div class="notification-content">
      <i [class]="icon(n.type)" aria-hidden="true"></i>
      <span class="notification-message">{{ n.message }}</span>
    </div>
    <button
      type="button"
      class="btn-close"
      aria-label="Fermer"
      (click)="notificationService.dismiss(n.id)">
    </button>
  </div>
</div>
