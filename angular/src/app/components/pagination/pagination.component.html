<div class="pagination" role="group" aria-label="Pagination">
  <!-- Première page -->
  <button *ngIf="showFirstLast"
          type="button" 
          class="pagination__btn pagination__btn--nav" 
          [class.pagination__btn--disabled]="!hasMultiplePages() || isFirstPage()"
          [disabled]="!hasMultiplePages() || isFirstPage()"
          (click)="goToFirstPage()"
          aria-label="Première page">
    <i class="fas fa-angle-double-left"></i>
  </button>
  
  <!-- Page précédente -->
  <button type="button" 
          class="pagination__btn pagination__btn--nav" 
          [class.pagination__btn--disabled]="!hasMultiplePages() || isFirstPage()"
          [disabled]="!hasMultiplePages() || isFirstPage()"
          (click)="goToPreviousPage()"
          aria-label="Page précédente">
    <i class="fas fa-angle-left"></i>
  </button>

  <!-- Pages numérotées -->
  <button type="button" 
          class="pagination__btn pagination__btn--page" 
          *ngFor="let page of getVisiblePages()"
          [class.pagination__btn--active]="page === currentPage"
          (click)="goToPage(page)"
          [attr.aria-label]="'Page ' + page"
          [attr.aria-current]="page === currentPage ? 'page' : null">
    {{ page }}
  </button>

  <!-- Page suivante -->
  <button type="button" 
          class="pagination__btn pagination__btn--nav" 
          [class.pagination__btn--disabled]="!hasMultiplePages() || isLastPage()"
          [disabled]="!hasMultiplePages() || isLastPage()"
          (click)="goToNextPage()"
          aria-label="Page suivante">
    <i class="fas fa-angle-right"></i>
  </button>
  
  <!-- Dernière page -->
  <button *ngIf="showFirstLast"
          type="button" 
          class="pagination__btn pagination__btn--nav" 
          [class.pagination__btn--disabled]="!hasMultiplePages() || isLastPage()"
          [disabled]="!hasMultiplePages() || isLastPage()"
          (click)="goToLastPage()"
          aria-label="Dernière page">
    <i class="fas fa-angle-double-right"></i>
  </button>
</div>

<!-- Informations de pagination -->
<div class="pagination-info" *ngIf="showInfo">
  Page <span class="current-page">{{ currentPage }}</span> 
  sur <span class="total-pages">{{ totalPages }}</span>
</div>
