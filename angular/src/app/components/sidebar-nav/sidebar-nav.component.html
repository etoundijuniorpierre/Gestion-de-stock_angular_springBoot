<nav class="sidebar-nav">
  <ul class="nav-menu">
    <li *ngFor="let item of navItems" class="nav-item">
      <a
        (click)="navigate(item.path)"
        class="nav-link"
        [class.active]="isCustomActive(item)"
      >
        <i [class]="item.icon + ' nav-icon'"></i>
        <span class="nav-text">{{ item.text }}</span>
      </a>
    </li>
  </ul>
</nav>
