<div class="col mb-3">
  <div class="client-form-container">
    <!-- Section Photo -->
    <div class="photo-section">
      <div class="photo-upload-btn" (click)="fileInput.click()">
        <img [src]="imgUrl" alt="Photo du client" />
        <input hidden type="file" #fileInput (change)="onFileInput(fileInput.files)">
      </div>
    </div>
    
    <hr class="my-4">
    
    <!-- Section Informations -->
    <div class="info-section">
      <h2><i class="fas fa-info-circle icon-primary"></i>&nbsp;Information du client</h2>
    </div>
    <!-- Alertes d'erreur -->
    <div class="alert alert-danger" *ngIf="errorMsg.length > 0">
      <div *ngFor="let msg of errorMsg">
        {{ msg }}
      </div>
    </div>
    
    <!-- Formulaire -->
    <form class="client-form">
      <div class="form-row">
        <div class="row">
          <div class="col-md-6 mb-3">
            <input type="text" class="form-control" placeholder="Nom"
                   name="nom" [(ngModel)]="client.nom">
          </div>
          <div class="col-md-6 mb-3">
            <input type="text" class="form-control" placeholder="Adresse 1"
                   name="adresse1" [(ngModel)]="adresseDto.adresse1">
          </div>
        </div>
      </div>
      
      <div class="form-row">
        <div class="row">
          <div class="col-md-6 mb-3">
            <input type="text" class="form-control" placeholder="Prénom"
                   name="prenom" [(ngModel)]="client.prenom">
          </div>
          <div class="col-md-6 mb-3">
            <input type="text" class="form-control" placeholder="Adresse 2"
                   name="adresse2" [(ngModel)]="adresseDto.adresse2">
          </div>
        </div>
      </div>
      
      <div class="form-row">
        <div class="row">
          <div class="col-md-6 mb-3">
            <input type="email" class="form-control" placeholder="E-mail"
                   name="email" [(ngModel)]="client.mail">
          </div>
          <div class="col-md-6 mb-3">
            <input type="text" class="form-control" placeholder="Ville"
                   name="ville" [(ngModel)]="adresseDto.ville">
          </div>
        </div>
      </div>
      
      <div class="form-row">
        <div class="row">
          <div class="col-md-6 mb-3">
            <input type="tel" class="form-control" placeholder="Téléphone"
                   name="numtel" [(ngModel)]="client.numTel">
          </div>
          <div class="col-md-6 mb-3">
            <input type="text" class="form-control" placeholder="Code postal"
                   name="codepostal" [(ngModel)]="adresseDto.codePostale">
          </div>
        </div>
      </div>
      
      <div class="form-row">
        <div class="row">
          <div class="col-md-6 mb-3">
            <!-- Espace vide pour équilibrer -->
          </div>
          <div class="col-md-6 mb-3">
            <input type="text" class="form-control" placeholder="Pays"
                   name="pays" [(ngModel)]="adresseDto.pays">
          </div>
        </div>
      </div>
    </form>
  </div>
  <!-- Boutons d'action -->
  <div class="col-md-12 text-right mt-4">
    <button class="btn btn-danger mr-3" (click)="cancelClick()">
      <i class="fas fa-ban"></i>&nbsp;
      Annuler
    </button>
    <button class="btn btn-primary" (click)="enregistrer()">
      <i class="fas fa-save"></i>&nbsp;
      {{ isEditMode ? 'Mettre à jour' : 'Enregistrer' }}
    </button>
  </div>
</div>
