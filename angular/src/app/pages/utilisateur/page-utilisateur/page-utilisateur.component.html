<div class="col">
  <div class="row m-3 align-items-center">
    <div class="col-md-8 p-0">
      <h1 class="h3 mb-0">
        <i class="fas fa-user-cog text-primary me-2"></i>
        Liste des utilisateurs
      </h1>
    </div>
    <div class="col-md-4 text-end">
      <app-button-action (clickEvent)="nouvelUtilisateur()"></app-button-action>
    </div>
  </div>

  <div class="col m-3">
    <div class="alert alert-danger" *ngIf="errorMsg">
      <i class="fas fa-exclamation-triangle me-2"></i> {{ errorMsg }}
    </div>

    <div *ngIf="isLoading" class="text-center p-5">
      <div class="spinner-border text-primary" role="status">
        <span class="visually-hidden">Chargement...</span>
      </div>
    </div>

    <div *ngIf="!isLoading && listUtilisateurs.length === 0" class="alert alert-info">
      <i class="fas fa-info-circle me-2"></i> Aucun utilisateur n'a encore été enregistré.
    </div>

    <div *ngIf="!isLoading && listUtilisateurs.length > 0 && filteredUtilisateurs.length === 0" class="alert alert-warning">
      <i class="fas fa-search me-2"></i> Aucun utilisateur ne correspond à votre recherche "{{ searchTerm }}".
    </div>

    <div *ngIf="!isLoading && getCurrentPageUtilisateurs.length > 0">
      <app-detail-utilisateur
        *ngFor="let utilisateur of getCurrentPageUtilisateurs"
        [utilisateur]="utilisateur"
        (suppressionResult)="handleSuppression($event)"
      ></app-detail-utilisateur>
    </div>
  </div>

  <div class="row mb-3" *ngIf="filteredUtilisateurs.length > 0">
    <div class="col-md-12 text-center">
      <app-pagination
        [currentPage]="currentPage"
        [totalPages]="totalPages"
        (pageChange)="onPageChange($event)"
      ></app-pagination>
    </div>
  </div>
</div>
