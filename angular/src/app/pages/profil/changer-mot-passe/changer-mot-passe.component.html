<div class="change-password-container">
    <div class="change-password-card card">
        <div class="card-body">
            <div class="change-password-header">
                <div class="change-password-icon">
                    <i class="fas fa-key"></i>
                </div>
                <h2>Changer le mot de passe</h2>
                <p class="text-muted">Veuillez saisir votre nouveau mot de passe</p>
            </div>

            <!-- Messages d'erreur/succès -->
            <div *ngIf="message.text" class="mb-3">
                <div [class]="'alert alert-' + (message.type === 'error' ? 'danger' : 'success')" role="alert">
                    <i [class]="'fas fa-' + (message.type === 'error' ? 'exclamation-triangle' : 'check-circle') + ' me-2'"></i>
                    {{message.text}}
                </div>
            </div>

            <form (ngSubmit)="onSubmit()">
                <!-- Current password input -->
                <div class="form-group">
                    <label class="form-label" for="currentPassword">Mot de passe actuel</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fas fa-lock"></i>
                        </span>
                        <input
                            [type]="showCurrentPassword ? 'text' : 'password'"
                            id="currentPassword"
                            class="form-control"
                            name="currentPassword"
                            [(ngModel)]="currentPassword"
                            placeholder="Entrez votre mot de passe actuel"
                            required
                        />
                        <button
                            type="button"
                            class="btn btn-outline-secondary password-toggle"
                            (click)="togglePasswordVisibility('current')"
                            tabindex="-1"
                        >
                            <i [class]="'fas ' + (showCurrentPassword ? 'fa-eye-slash' : 'fa-eye')"></i>
                        </button>
                    </div>
                </div>

                <!-- New password input -->
                <div class="form-group">
                    <label class="form-label" for="newPassword">Nouveau mot de passe</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fas fa-key"></i>
                        </span>
                        <input
                            [type]="showNewPassword ? 'text' : 'password'"
                            id="newPassword"
                            class="form-control"
                            name="newPassword"
                            [(ngModel)]="newPassword"
                            placeholder="Entrez votre nouveau mot de passe"
                            required
                        />
                        <button
                            type="button"
                            class="btn btn-outline-secondary password-toggle"
                            (click)="togglePasswordVisibility('new')"
                            tabindex="-1"
                        >
                            <i [class]="'fas ' + (showNewPassword ? 'fa-eye-slash' : 'fa-eye')"></i>
                        </button>
                    </div>
                </div>

                <!-- Confirm password input -->
                <div class="form-group">
                    <label class="form-label" for="confirmPassword">Confirmer le mot de passe</label>
                    <div class="input-group">
                        <span class="input-group-text">
                            <i class="fas fa-lock"></i>
                        </span>
                        <input
                            [type]="showConfirmPassword ? 'text' : 'password'"
                            id="confirmPassword"
                            class="form-control"
                            name="confirmPassword"
                            [(ngModel)]="confirmPassword"
                            placeholder="Confirmez votre nouveau mot de passe"
                            required
                        />
                        <button
                            type="button"
                            class="btn btn-outline-secondary password-toggle"
                            (click)="togglePasswordVisibility('confirm')"
                            tabindex="-1"
                        >
                            <i [class]="'fas ' + (showConfirmPassword ? 'fa-eye-slash' : 'fa-eye')"></i>
                        </button>
                    </div>
                </div>

                <!-- Submit buttons -->
                <div class="button-group">
                    <!-- Cancel button -->
                    <button 
                        type="button" 
                        class="btn btn-outline-danger"
                        (click)="cancel()"
                        [disabled]="isLoading"
                    >
                        <i class="fas fa-ban me-2"></i>
                        Annuler
                    </button>

                    <!-- Submit button -->
                    <button 
                        type="submit" 
                        class="btn btn-primary"
                        [disabled]="isLoading"
                    >
                        <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
                        <i *ngIf="!isLoading" class="fas fa-save me-2"></i>
                        {{ isLoading ? 'Enregistrement...' : 'Enregistrer' }}
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
