version: '3.8'

services:
  spring-boot:
    build:
      context: ./springBoot
      dockerfile: Dockerfile
    container_name: gestion-stock-backend
    ports:
      - "6001:6001"  # Port non standard pour le backend
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/gestionstock
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=password
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
    depends_on:
      - postgres
    networks:
      - app-network

  angular:
    build:
      context: ./angular
      dockerfile: Dockerfile
    container_name: gestion-stock-frontend
    ports:
      - "6002:6002"  # Port non standard pour le frontend
    depends_on:
      - spring-boot
    networks:
      - app-network

  postgres:
    image: postgres:15-alpine
    container_name: gestion-stock-db
    ports:
      - "6003:5432"  # Port non standard pour la base de données
    environment:
      - POSTGRES_DB=gestionstock
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app-network

volumes:
  postgres_data:

networks:
  app-network:
    driver: bridge
